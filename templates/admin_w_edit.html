{% extends "base.html" %}
{% block title %}Edit article{% endblock %}
{% block content %}
<section class="page-head"><h1>Edit article</h1><p class="lead"><a href="{{ url_for('admin_writing') }}">&larr; Back</a></p></section>
<form id="wform" method="post" class="form" data-cloud="{{ cloud }}" data-preset="{{ preset }}">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Heading (title)<input name="title" required maxlength="150" value="{{ a.title }}"></label>
  <label>Type<select name="wtype">{% for t in types %}<option {{ 'selected' if t == a.type }}>{{ t }}</option>{% endfor %}</select></label>
  <label>Description (chhota summary)<textarea name="summary" rows="2" maxlength="400">{{ a.summary }}</textarea></label>
  <label>Article<textarea class="notepad" name="body" rows="14" maxlength="30000">{{ a.body }}</textarea></label>
  {% if a.file_url %}<label class="chk"><input type="checkbox" name="remove_file" value="1"> Attached file hata do</label>{% endif %}
  {% if cloud and preset %}<label>Nayi file upload (optional)<input type="file" id="afile" accept=".pdf,.doc,.docx,.txt"></label>{% endif %}
  <label>Ya naya link (optional)<input type="url" name="file_link" placeholder="https://"></label>
  <input type="hidden" name="file_url" id="file_url">
  <button class="btn" type="submit" id="go">Save</button>
  <p id="status" class="soon"></p>
</form>
<script src="{{ url_for('static', filename='admin.js') }}"></script>
{% endblock %}
