{% extends "base.html" %}
{% block title %}{{ a.title }} - {{ p.name }}{% endblock %}
{% block content %}
<article class="read">
  <p class="eyebrow">{{ a.type }} &middot; {{ a.date }}</p>
  <h1 class="wtitle">{{ a.title }}</h1>
  {% if a.body %}<div class="abody">{{ a.body }}</div>{% endif %}
  <div class="links">
    {% if a.file_url %}<a class="btn" href="{{ a.file_url }}" target="_blank" rel="noopener">Open attached file</a>{% endif %}
    <a class="btn ghost" href="{{ url_for('writing') }}">&larr; All writing</a>
  </div>
</article>
{% endblock %}
